<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Berichtsheft</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;650;750&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Arbeitsfläche wie ein Ordner – links das Register der Wochen, rechts das aufgeschlagene Blatt. */
:root{
  --bg:#eef1f5; --paper:#ffffff; --ink:#1b2430; --muted:#5d6878; --line:#d5dbe4; --soft:#f5f7fa;
  --accent:#1f4fa8; --accent-ink:#ffffff; --accent-soft:#e4ecfa;
  --ok:#1d7a4a; --ok-soft:#e2f3e9; --warn:#9a5b00; --warn-soft:#fbefdc; --danger:#b3261e; --danger-soft:#fbe5e3;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --paper:#1a2029; --ink:#e7ebf1; --muted:#9aa5b5; --line:#2e3744; --soft:#212835;
  --accent:#7aa5ff; --accent-ink:#0d1626; --accent-soft:#22314d;
  --ok:#5fd394; --ok-soft:#183427; --warn:#f2b45c; --warn-soft:#3a2c14; --danger:#ff8a80; --danger-soft:#3d1d1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --paper:#1a2029; --ink:#e7ebf1; --muted:#9aa5b5; --line:#2e3744; --soft:#212835;
  --accent:#7aa5ff; --accent-ink:#0d1626; --accent-soft:#22314d;
  --ok:#5fd394; --ok-soft:#183427; --warn:#f2b45c; --warn-soft:#3a2c14; --danger:#ff8a80; --danger-soft:#3d1d1b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.gated .register,.gated #btnWord,.gated #btnSettings{display:none}
.gated .layout{grid-template-columns:minmax(0,1fr);max-width:760px}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Kopfzeile */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.topbar .in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1280px;margin:0 auto;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand h1{font-size:1.2rem;font-weight:750}
.brand span{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:.8rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 13px;cursor:pointer;line-height:1.2;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--danger);border-color:var(--line);background:var(--paper)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.small{padding:5px 10px;font-size:.9rem}

/* Hauptlayout */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;max-width:1280px;margin:0 auto;padding-block:20px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}

/* Wochen-Register */
.register{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);
  max-height:calc(100vh - 100px);display:flex;flex-direction:column;min-width:0}
.register .head{display:flex;align-items:center;gap:8px;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.register .head h2{font-size:1rem;margin-right:auto}
.wlist{overflow:auto;padding:6px;display:flex;flex-direction:column;gap:2px}
.witem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-align:left;width:100%;background:transparent;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}
.witem:hover{background:var(--soft)}
.witem[aria-current="true"]{background:var(--accent-soft)}
.witem .kw{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);grid-row:span 2}
.witem .rng{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.witem .dep{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;grid-column:2}
.witem .sig{grid-row:1/span 2;grid-column:3;display:flex;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.dot.on{background:var(--ok);border-color:var(--ok)}
.yr{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.badge{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
@media (max-width:860px){
  .register{position:static;max-height:none}
  .register.collapsed .wlist{display:none}
  .register.collapsed .head{border-bottom:0}
}
.togglelist{display:none}
@media (max-width:860px){.togglelist{display:inline-flex}}

/* Blatt */
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:22px;min-width:0}
@media (max-width:560px){.sheet{padding:16px}}
.sheet-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.sheet-head h2{font-size:1.35rem;font-weight:750}
.sheet-head .rng{font-family:var(--f-mono);color:var(--muted)}
.grid3{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr) minmax(0,1.4fr);gap:14px}
@media (max-width:700px){.grid3{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:.82rem;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Abschnitte wie im Formular: grauer Kopf, Stundenspalte rechts */
.form{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sec{display:grid;grid-template-columns:minmax(0,1fr) 118px}
.sec+.sec{border-top:1px solid var(--line)}
.sec .shead{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 118px;background:var(--soft);border-bottom:1px solid var(--line)}
.sec .shead div{padding:9px 14px;font-weight:600;font-size:.95rem}
.sec .shead div+div{border-left:1px solid var(--line);font-style:italic;font-weight:400;color:var(--muted)}
.sec textarea{border:0;border-radius:0;min-height:110px;resize:vertical;padding:12px 14px;line-height:1.5;box-shadow:none}
.sec textarea:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.sec .hours{border-left:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:4px}
.sec .hours input{text-align:right;font-family:var(--f-mono)}
.sec.abs .shead{background:var(--warn-soft)}
.sec.abs .body{padding:12px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sec.abs .body select{width:auto;min-width:150px}
.sec.abs .body input[type=text]{flex:1;min-width:180px;width:auto}
@media (max-width:520px){.sec,.sec .shead{grid-template-columns:minmax(0,1fr) 84px}}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .sum{margin-left:auto;font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Unterschriften */
.sigs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:640px){.sigs{grid-template-columns:minmax(0,1fr)}}
.sigbox{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sigline{display:flex;align-items:flex-end;gap:12px;min-height:62px;border-bottom:1px solid var(--ink);padding-bottom:4px}
.sigline img{max-height:54px;max-width:60%;object-fit:contain;background:#fff;border-radius:4px}
.sigline .empty{color:var(--muted);font-size:.9rem;padding-bottom:4px}
.sigline .date{font-family:var(--f-mono);font-size:.9rem}
.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.datebar input{width:auto}

.foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.foot .spacer{margin-left:auto}

/* Leerer Zustand */
.empty-state{display:flex;flex-direction:column;gap:12px;align-items:flex-start;max-width:56ch}
.empty-state h2{font-size:1.4rem}
.steps{display:grid;gap:8px;margin:4px 0 6px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-size:.8rem;width:22px;height:22px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}

/* Dialog */
.backdrop{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 40px) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--paper);border:1px solid var(--line);border-radius:14px;width:min(680px,100%);padding:22px;display:flex;flex-direction:column;gap:18px}
.modal .mh{display:flex;align-items:center;gap:10px}
.modal .mh h2{font-size:1.2rem;margin-right:auto}
.group{display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
.group h3{font-size:.98rem}
.imgslot{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.imgslot .prev{width:180px;height:64px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;background:#fff;overflow:hidden}
.imgslot .prev img{max-width:100%;max-height:100%;object-fit:contain}
.imgslot .prev span{color:#8a93a1;font-size:.85rem}
.siglib{display:flex;flex-direction:column;gap:8px}
.sigrow{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:10px;align-items:center}
.sigrow .th{height:48px;background:#fff;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;overflow:hidden}
.sigrow .th img{max-width:100%;max-height:100%;object-fit:contain}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.pick button{display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px;cursor:pointer}
.pick button:hover,.pick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pick .th{height:56px;background:#fff;border-radius:6px;display:grid;place-items:center;overflow:hidden}
.pick .th img{max-width:100%;max-height:100%;object-fit:contain}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 10px;font-size:.9rem}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--muted);border-radius:50%;width:22px;height:22px}
.chip button:hover{background:var(--danger-soft);color:var(--danger)}
.note{font-size:.88rem;background:var(--soft);border-radius:8px;padding:10px 12px;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--danger-soft);border-radius:8px;padding:8px 10px}
.confirm span{color:var(--danger);font-weight:600}

/* Hinweis-Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:30;background:var(--ink);color:var(--paper);
  border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast button{background:transparent;border:0;color:var(--paper);font-weight:600;text-decoration:underline;cursor:pointer}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.92rem}
@media (prefers-reduced-motion: no-preference){.btn,.witem{transition:background-color .12s,border-color .12s}}
</style>
</head>
<body>


<div class="topbar"><div class="in">
  <div class="brand"><h1>Berichtsheft</h1><span id="brandSub">Ausbildungsnachweis (wöchentlich)</span></div>
  <span class="status" id="saveStatus" aria-live="polite"></span>
  <button class="btn" id="btnSettings" type="button">Einstellungen</button>
  <button class="btn primary" id="btnWord" type="button">Word herunterladen</button>
</div></div>

<div class="layout">
  <aside class="register" id="register">
    <div class="head">
      <h2 id="listTitle">Wochen</h2>
      <button class="btn ghost small togglelist" id="btnToggleList" type="button">Anzeigen</button>
      <button class="btn small" id="btnNewWeek" type="button">+ Neue Woche</button>
    </div>
    <div class="wlist" id="wlist"></div>
  </aside>
  <main class="sheet" id="sheet"></main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<input type="file" id="filePick" accept="image/png,image/jpeg,image/webp" hidden>
<input type="file" id="jsonPick" accept="application/json,.json" hidden>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<script>/* Berichtsheft – Speicher in Google Drive (nur Dateien, die diese App selbst anlegt: Scope drive.file).
 * Ordner "Berichtsheft" mit zwei Dateien:
 *   berichtsheft-daten.json   – Wochen und Einstellungen (ohne Bilder)
 *   berichtsheft-bilder.json  – Logo und Unterschriften (data-URLs)
 */
(function () {
  'use strict';
  var cfg = window.BERICHTSHEFT_CONFIG;
  var API = 'https://www.googleapis.com/drive/v3/files';
  var UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';
  var FOLDER = 'Berichtsheft', DATA = 'berichtsheft-daten.json', IMAGES = 'berichtsheft-bilder.json';
  var CACHE = 'berichtsheft-drive-cache';

  var token = null, tokenClient = null, pendingAuth = null;
  var ids = { folder: null, data: null, images: null };
  var versions = { data: null };
  var lastImagesJson = null;

  function gsiReady() {
    return new Promise(function (res, rej) {
      var n = 0;
      (function wait() {
        if (window.google && google.accounts && google.accounts.oauth2) return res();
        if (++n > 100) return rej(new Error('Google-Anmeldung konnte nicht geladen werden.'));
        setTimeout(wait, 100);
      })();
    });
  }

  function requestToken(prompt) {
    return gsiReady().then(function () {
      return new Promise(function (res, rej) {
        if (!tokenClient) {
          tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: cfg.clientId, scope: cfg.scope,
            callback: function (r) {
              var p = pendingAuth; pendingAuth = null;
              if (!p) return;
              if (r.error) return p.rej(new Error(r.error_description || r.error));
              token = r.access_token; p.res(token);
            },
            error_callback: function (e) {
              var p = pendingAuth; pendingAuth = null;
              if (p) p.rej(new Error(e && e.type === 'popup_closed' ? 'Anmeldung abgebrochen.' : 'Anmeldung nicht möglich.'));
            }
          });
        }
        pendingAuth = { res: res, rej: rej };
        tokenClient.requestAccessToken({ prompt: prompt || '' });
      });
    });
  }

  function AuthError(msg) { var e = new Error(msg || 'Anmeldung abgelaufen.'); e.code = 'auth'; return e; }

  function api(url, opts) {
    if (!token) return Promise.reject(AuthError());
    opts = opts || {};
    opts.headers = Object.assign({ Authorization: 'Bearer ' + token }, opts.headers || {});
    return fetch(url, opts).then(function (r) {
      if (r.status === 401) { token = null; throw AuthError(); }
      if (!r.ok) return r.text().then(function (t) { throw new Error('Google Drive: HTTP ' + r.status + ' ' + t.slice(0, 200)); });
      return r;
    });
  }
  function findFile(name, mime, parent) {
    var q = "name='" + name + "' and trashed=false" + (mime ? " and mimeType='" + mime + "'" : '') + (parent ? " and '" + parent + "' in parents" : '');
    return api(API + '?q=' + encodeURIComponent(q) + '&fields=files(id,version)&orderBy=createdTime&spaces=drive')
      .then(function (r) { return r.json(); }).then(function (j) { return j.files && j.files[0] || null; });
  }
  function createFile(name, mime, parent, content) {
    var meta = { name: name, mimeType: mime };
    if (parent) meta.parents = [parent];
    if (content == null) {
      return api(API + '?fields=id,version', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(meta) })
        .then(function (r) { return r.json(); });
    }
    var b = 'bh' + Math.random().toString(36).slice(2);
    var body = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) +
      '\r\n--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + content + '\r\n--' + b + '--';
    return api(UPLOAD + '?uploadType=multipart&fields=id,version', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body: body })
      .then(function (r) { return r.json(); });
  }
  function readFile(id) { return api(API + '/' + id + '?alt=media').then(function (r) { return r.text(); }); }
  function writeFile(id, content) {
    return api(UPLOAD + '/' + id + '?uploadType=media&fields=id,version', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json; charset=UTF-8' }, body: content
    }).then(function (r) { return r.json(); });
  }
  function getVersion(id) {
    return api(API + '/' + id + '?fields=version').then(function (r) { return r.json(); }).then(function (j) { return j.version; });
  }

  function split(data) {
    var s = data.settings || {};
    var images = { logo: s.logo || null, mySig: s.mySig || null, ausbilderSigs: s.ausbilderSigs || [] };
    var meta = JSON.parse(JSON.stringify(data));
    meta.settings.logo = null; meta.settings.mySig = null;
    meta.settings.ausbilderSigs = (s.ausbilderSigs || []).map(function (x) { return { id: x.id, name: x.name }; });
    return { meta: meta, images: images };
  }
  function join(meta, images) {
    var s = meta.settings || {};
    images = images || {};
    s.logo = images.logo || null; s.mySig = images.mySig || null;
    var byId = {};
    (images.ausbilderSigs || []).forEach(function (x) { byId[x.id] = x; });
    s.ausbilderSigs = (s.ausbilderSigs || []).map(function (x) { return Object.assign({}, byId[x.id] || {}, { id: x.id, name: x.name }); })
      .filter(function (x) { return x.dataUrl; });
    meta.settings = s;
    return meta;
  }
  function cache(d) { try { localStorage.setItem(CACHE, JSON.stringify(d)); } catch (e) {} }

  function locate() {
    return findFile(FOLDER, 'application/vnd.google-apps.folder', null).then(function (f) {
      return f || createFile(FOLDER, 'application/vnd.google-apps.folder', null, null);
    }).then(function (f) {
      ids.folder = f.id;
      return Promise.all([findFile(DATA, null, ids.folder), findFile(IMAGES, null, ids.folder)]);
    }).then(function (r) {
      ids.data = r[0] && r[0].id; versions.data = r[0] && r[0].version;
      ids.images = r[1] && r[1].id;
    });
  }

  var DriveStore = {
    label: 'Deine Daten liegen in deinem Google Drive im Ordner „Berichtsheft“. Die App sieht nur Dateien, die sie selbst angelegt hat.',
    needsAuth: true,
    signedIn: function () { return !!token; },
    signIn: function () { return requestToken(''); },

<script>/* Berichtsheft – Word-Generator (läuft im Browser und in Node).

(function (root) {
  'use strict';

  var EMU_PER_PX = 9525;

      }
      var sigP = '<w:p><w:pPr><w:pStyle w:val="BodyText"/><w:tabs><w:tab w:val="left" w:pos="5889"/><\/w:tabs>' +
        '<w:spacing w:before="0" w:after="0"/><w:ind w:start="216"/>' + RPR + '<\/w:pPr>' + runs + '<\/w:p>';

      var c = tpl.files[p];
      if (p === 'word/_rels/document.xml.rels') c = c.replace('<\/Relationships>', rels.join('') + '<\/Relationships>');
      if (p === 'docProps/core.xml') c = c.split('@@NAME@@').join(esc(settings.name || '')).split('@@NOW@@').join(now);
      zip.file(p, c);
    });

    var logo = settings.logo, logoFile, lb;
    if (logo) {

      var cx = Math.round(LOGO_H * logo.w / logo.h), cy = LOGO_H;

function todayISO(){ var d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function mondayOf(iso){ var d = new Date(iso+'T12:00:00Z'); var wd = (d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-wd); return d.toISOString().slice(0,10); }
function isoWeek(iso){ var d = new Date(iso+'T12:00:00Z'); var wd=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-wd+3); var y=d.getUTCFullYear(); var f=new Date(Date.UTC(y,0,4)); return 1+Math.round(((d-f)/864e5-3+((f.getUTCDay()+6)%7))/7); }
function shortDe(iso){ var p=iso.split('-'); return p[2]+'.'+p[1]+'.'; }
function rangeDe(m){ return shortDe(m)+'–'+D.de(D.addDays(m,6)); }
function num(v){ var n = Number(String(v||'').replace(',','.')); return isFinite(n) ? n : 0; }
function sorted(){ return data.weeks.slice().sort(function(a,b){ return a.monday<b.monday?-1:1; }); }
function findWeek(m){ for (var i=0;i<data.weeks.length;i++) if (data.weeks[i].monday===m) return data.weeks[i]; return null; }
function newWeek(m){ return { id:m, monday:m, jahr:data.settings.lastJahr||'1', abteilung:data.settings.lastAbteilung||'',
  b:{text:'',hours:''}, u:{text:'',hours:''}, s:{text:'',hours:''}, absence:null, sign:{me:false,ausbilderId:null,date:null} }; }
function hasContent(w){ return !!(w.b.text||w.u.text||w.s.text||w.b.hours||w.u.hours||w.s.hours||w.absence||w.sign.me||w.sign.ausbilderId); }
function ausById(id){ var l=data.settings.ausbilderSigs||[]; for (var i=0;i<l.length;i++) if (l[i].id===id) return l[i]; return null; }

var toastTimer;
function toast(msg, action){
  var r = $('toastRoot'); r.innerHTML='';
  var t = h('div',{class:'toast',role:'status'},[h('span',{text:msg}), action ? h('button',{type:'button',text:action.label,onclick:function(){ r.innerHTML=''; action.run(); }}) : null]);
  r.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ r.innerHTML=''; }, action ? 7000 : 3500);
}

/* ---------- Speichern ---------- */
var saveTimer, saving = false, dirty = false;
function setStatus(t){ $('saveStatus').textContent = t; }
function persist(){
  dirty = true;
  if (ui.conflict || ui.authLost) return;
  clearTimeout(saveTimer); setStatus('Speichert …');
  saveTimer = setTimeout(doSave, store.needsAuth ? 1200 : 400);
}
function doSave(){
  if (saving){ clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 500); return; }
  saving = true; dirty = false;
  store.save(data).then(function(){
    saving = false;
    if (dirty){ saveTimer = setTimeout(doSave, 300); return; }
    setStatus('Gespeichert');
  }).catch(function(e){
    saving = false; dirty = true;
    setStatus('Nicht gespeichert');
    if (e && e.code === 'auth'){ ui.authLost = true; renderSheet(); return; }
    if (e && e.code === 'conflict'){ ui.conflict = true; renderSheet(); return; }
    toast('Speichern fehlgeschlagen: '+(e && e.message ? e.message : e), {label:'Erneut versuchen', run:persist});
  });
}
function reloadFromStore(msg){
  return store.load().then(function(d){
    if (d && d.weeks){ var b = blank(); d.settings = Object.assign(b.settings, d.settings||{}); data = d; } else { data = blank(); }
    var keep = cur && cur.monday, ws = sorted();
    openWeek(keep && findWeek(keep) ? keep : (ws.length ? ws[ws.length-1].monday : mondayOf(todayISO())));
    renderList(); updBrand(); setStatus(ws.length ? 'Gespeichert' : '');
    if (msg) toast(msg);
  });
}
function syncBanner(){
  if (ui.authLost) return h('div',{class:'banner'},[h('span',{text:'Die Anmeldung bei Google ist abgelaufen. Deine letzten Änderungen sind noch nicht gespeichert.'}),
    h('button',{class:'btn small',type:'button',text:'Erneut anmelden',onclick:function(){
      store.signIn().then(function(){ ui.authLost=false; renderSheet(); persist(); }).catch(function(e){ toast(e.message); }); }})]);
  if (ui.conflict) return h('div',{class:'banner'},[h('span',{text:'Auf einem anderen Gerät wurde inzwischen etwas geändert. Welche Version soll gelten?'}),
    h('button',{class:'btn small',type:'button',text:'Version aus Drive laden',onclick:function(){
      ui.conflict=false; dirty=false; reloadFromStore('Daten aus Google Drive geladen').catch(function(e){ toast(e.message); }); }}),
    h('button',{class:'btn small',type:'button',text:'Meine Änderungen behalten',onclick:function(){
      store.adoptRemote().then(function(){ ui.conflict=false; renderSheet(); persist(); }).catch(function(e){ toast(e.message); }); }})]);
  return null;
}
function touch(){
  if (isDraft && hasContent(cur)){ data.weeks.push(cur); isDraft = false; renderList(); }
  if (!isDraft){ persist(); renderList(); }
}

/* ---------- Wochenliste ---------- */
function renderList(){
  var l = $('wlist'); l.innerHTML='';
  var ws = sorted().reverse();
  $('listTitle').textContent = 'Wochen' + (ws.length ? ' ('+ws.length+')' : '');
  var reg = $('register'); reg.classList.toggle('collapsed', !ui.listOpen);
  $('btnToggleList').textContent = ui.listOpen ? 'Ausblenden' : 'Anzeigen';
  if (!ws.length){ l.appendChild(h('p',{class:'hint',style:'padding:10px',text:'Noch keine Wochen.'})); return; }
  var lastYear = null;
  ws.forEach(function(w){
    if (w.jahr !== lastYear){ lastYear = w.jahr; l.appendChild(h('div',{class:'yr',text:(w.jahr||'–')+'. Ausbildungsjahr'})); }
    l.appendChild(h('button',{type:'button',class:'witem','aria-current': cur && !isDraft && cur.monday===w.monday ? 'true':'false',
      onclick:function(){ openWeek(w.monday); ui.listOpen=false; renderList(); window.scrollTo(0,0); }},[
      h('span',{class:'kw',text:'KW '+String(isoWeek(w.monday)).padStart(2,'0')}),
      h('span',{class:'rng',text:rangeDe(w.monday)}),
      h('span',{class:'dep'},[w.beispiel ? h('span',{class:'badge',text:'Beispiel'}) : null, w.beispiel ? ' ' : '', w.abteilung||'—']),
      h('span',{class:'sig',title:'Unterschrift Azubi / Ausbilder'},[h('span',{class:'dot'+(w.sign.me?' on':'')}),h('span',{class:'dot'+(w.sign.ausbilderId?' on':'')})])
    ]));
  });
}

/* ---------- Woche öffnen ---------- */
function openWeek(m){
  m = mondayOf(m);
  var w = findWeek(m);
  ui.confirmDelete = false;
  if (w){ cur = w; isDraft = false; } else { cur = newWeek(m); isDraft = true; }
  renderSheet();
}
function nextMonday(){
  var ws = sorted();
  if (!ws.length) return mondayOf(todayISO());
  return D.addDays(ws[ws.length-1].monday, 7);
}

    h('h2',{text:'Mit Google anmelden'}),
    h('p',{class:'muted',text:'Deine Wochen, Unterschriften und das Logo werden in deinem Google Drive im Ordner „Berichtsheft“ gespeichert. So siehst du auf jedem Gerät denselben Stand.'}),
    h('p',{class:'hint',text:'Die App bekommt nur Zugriff auf Dateien, die sie selbst anlegt – nicht auf den Rest deines Drive.'}),

  ]));

function startSignIn(){
  var b = $('btnSignIn'); if (b){ b.disabled = true; b.textContent = 'Anmeldung läuft …'; }
  store.signIn().then(function(){ setStatus('Lädt …'); return store.load(); }).then(function(d){
    ui.gate = false; document.body.classList.remove('gated');
    if (d && d.weeks){ var bl = blank(); d.settings = Object.assign(bl.settings, d.settings||{}); data = d; }
    var ws = sorted();
    openWeek(ws.length ? ws[ws.length-1].monday : mondayOf(todayISO()));

    ui.gate = true; var s = $('sheet'); s.innerHTML=''; renderGate(s, e && e.message ? e.message : String(e)); setStatus('');

function copyPrev(){
  var w = cur, prev = null;
  sorted().forEach(function(x){ if (x.monday < w.monday) prev = x; });
  if (!prev){ toast('Es gibt keine frühere Woche.'); return; }
  var before = { b:w.b.text, u:w.u.text, s:w.s.text };
  w.b.text = prev.b.text; w.u.text = prev.u.text; w.s.text = prev.s.text;
  touch(); renderSheet();
  toast('Punkte aus KW '+isoWeek(prev.monday)+' übernommen', { label:'Rückgängig', run:function(){ w.b.text=before.b; w.u.text=before.u; w.s.text=before.s; touch(); renderSheet(); }});
}

  var boxMe = h('div',{class:'sigbox'},[
    h('span',{class:'lbl',text:'Auszubildende/r'}),

          if (!me){ toast('Zuerst deine Unterschrift in den Einstellungen hinterlegen.', {label:'Einstellungen', run:function(){ openSettings('mySig'); }}); return; }

    h('span',{class:'lbl',text:'Ausbildende/r bzw. Ausbilder/in'}),

      h('button',{class:'btn small'+(w.sign.ausbilderId?'':' primary'),type:'button',text:w.sign.ausbilderId?'Andere wählen':'Unterschrift wählen',onclick:function(){ openPicker(w); }}),

    w.sign.date = e.target.value && e.target.value!==auto ? e.target.value : null; touch(); renderSheet(); }});

/* ---------- Bilder ---------- */
var pickHandler = null;
$('filePick').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0]; e.target.value='';
  if (!f || !pickHandler) return;
  var cb = pickHandler; pickHandler = null;
  readImage(f).then(cb).catch(function(){ toast('Das Bild konnte nicht gelesen werden. Bitte PNG oder JPG verwenden.'); });
});
function pickImage(cb){ pickHandler = cb; $('filePick').click(); }
function readImage(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = rej;
    fr.onload = function(){
      var img = new Image();
      img.onerror = rej;
      img.onload = function(){
        var max = 900, w = img.naturalWidth, hh = img.naturalHeight, s = Math.min(1, max/Math.max(w,hh));
        var c = document.createElement('canvas'); c.width = Math.round(w*s); c.height = Math.round(hh*s);
        var png = file.type === 'image/png';
        var ctx = c.getContext('2d');
        if (!png){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); }
        ctx.drawImage(img,0,0,c.width,c.height);
        res({ dataUrl: c.toDataURL(png?'image/png':'image/jpeg', .92), w:c.width, h:c.height, ext: png?'png':'jpg' });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function uid(){ return 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ---------- Dialoge ---------- */
function closeModal(){ $('modalRoot').innerHTML=''; document.removeEventListener('keydown', escClose); }
function escClose(e){ if (e.key==='Escape') closeModal(); }
function modal(title, body){
  var root = $('modalRoot'); root.innerHTML='';
  var m = h('div',{class:'modal',role:'dialog','aria-modal':'true','aria-label':title},[
    h('div',{class:'mh'},[h('h2',{text:title}), h('button',{class:'btn small',type:'button',text:'Schließen',onclick:closeModal})])].concat(body));
  var bd = h('div',{class:'backdrop',onclick:function(e){ if (e.target===bd) closeModal(); }},[m]);
  root.appendChild(bd); document.addEventListener('keydown', escClose);
  return m;
}

function openPicker(w){
  var list = data.settings.ausbilderSigs || [];
  var grid = h('div',{class:'pick'}, list.map(function(sg){
    return h('button',{type:'button','aria-pressed':w.sign.ausbilderId===sg.id?'true':'false',onclick:function(){ w.sign.ausbilderId=sg.id; touch(); closeModal(); renderSheet(); }},[
      h('div',{class:'th'},[h('img',{src:sg.dataUrl,alt:''})]), h('span',{text:sg.name||'Ohne Namen'})]);
  }));
  var nameIn = h('input',{type:'text',id:'p-name',placeholder:'Name, z. B. Frau Schmidt'});
  modal('Unterschrift Ausbilder/in wählen', [
    list.length ? grid : h('p',{class:'note',text:'Noch keine Unterschriften gespeichert. Füge unten die erste hinzu.'}),
    h('div',{class:'group'},[h('h3',{text:'Neue Unterschrift hinzufügen'}),
      h('div',{class:'row'},[nameIn, h('button',{class:'btn',type:'button',text:'Bild auswählen …',onclick:function(){
        pickImage(function(img){ var sg = Object.assign({id:uid(), name:nameIn.value.trim()||'Ausbilder/in'}, img);
          (data.settings.ausbilderSigs = list).push(sg); w.sign.ausbilderId = sg.id; touch(); persist(); closeModal(); renderSheet(); toast('Unterschrift gespeichert und gesetzt'); }); }})])])
  ]);
}

function imgSlot(label, key, hint){
  var cur = data.settings[key];
  return h('div',{class:'group',id:'g-'+key},[h('h3',{text:label}), hint ? h('span',{class:'hint',text:hint}) : null,
    h('div',{class:'imgslot'},[
      h('div',{class:'prev'},[cur ? h('img',{src:cur.dataUrl,alt:label}) : h('span',{text:'Kein Bild'})]),
      h('button',{class:'btn',type:'button',text:cur?'Ersetzen …':'Bild auswählen …',onclick:function(){ pickImage(function(img){ data.settings[key]=img; persist(); openSettings(); renderSheet(); }); }}),
      cur ? h('button',{class:'btn ghost',type:'button',text:'Entfernen',onclick:function(){ data.settings[key]=null; persist(); openSettings(); renderSheet(); }}) : null
    ])]);
}

function openSettings(focusKey){
  var st = data.settings;
  var nameIn = h('input',{type:'text',id:'s-name',value:st.name||'',placeholder:'Vorname Nachname',oninput:function(e){ st.name=e.target.value; persist(); updBrand(); }});
  var lib = h('div',{class:'siglib'}, (st.ausbilderSigs||[]).map(function(sg){
    var del = h('button',{class:'btn ghost small',type:'button',text:'Löschen',onclick:function(){
      st.ausbilderSigs = st.ausbilderSigs.filter(function(x){return x!==sg;});
      data.weeks.forEach(function(x){ if (x.sign.ausbilderId===sg.id) x.sign.ausbilderId=null; });
      persist(); openSettings(); renderSheet(); renderList(); }});
    return h('div',{class:'sigrow'},[h('div',{class:'th'},[h('img',{src:sg.dataUrl,alt:''})]),
      h('input',{type:'text',value:sg.name||'','aria-label':'Name',oninput:function(e){ sg.name=e.target.value; persist(); }}), del]);
  }));
  var deps = h('div',{class:'chips'}, (st.abteilungen||[]).map(function(d){
    return h('span',{class:'chip'},[d, h('button',{type:'button','aria-label':d+' entfernen',text:'×',onclick:function(){
      st.abteilungen = st.abteilungen.filter(function(x){return x!==d;}); persist(); openSettings(); }})]); }));
  var conf = ui.confirmWipe;
  var m = modal('Einstellungen', [
    h('div',{class:'field'},[h('label',{for:'s-name',text:'Name des/der Auszubildenden'}), nameIn]),
    imgSlot('IHK-Logo (Kopfzeile)','logo','Erscheint oben links auf jeder Seite.'),
    imgSlot('Meine Unterschrift','mySig','Am besten ein Foto oder Scan auf weißem Hintergrund.'),
    h('div',{class:'group'},[h('h3',{text:'Unterschriften Ausbilder/in'}),
      (st.ausbilderSigs||[]).length ? lib : h('span',{class:'hint',text:'Noch keine. Hinzufügen geht hier oder direkt beim Unterschreiben einer Woche.'}),
      h('div',{class:'row'},[h('button',{class:'btn',type:'button',text:'+ Unterschrift hinzufügen …',onclick:function(){
        pickImage(function(img){ (st.ausbilderSigs = st.ausbilderSigs||[]).push(Object.assign({id:uid(),name:'Ausbilder/in'},img)); persist(); openSettings(); }); }})])]),
    h('div',{class:'group'},[h('h3',{text:'Abteilungen'}),
      (st.abteilungen||[]).length ? deps : h('span',{class:'hint',text:'Neue Abteilungen legst du direkt in einer Woche an.'})]),
    h('div',{class:'group'},[h('h3',{text:'Daten'}),
      h('p',{class:'note',text:store.label}),
      h('div',{class:'row'},[
        h('button',{class:'btn',type:'button',text:'Sicherung herunterladen',onclick:exportJson}),
        h('button',{class:'btn',type:'button',text:'Sicherung importieren …',onclick:function(){ $('jsonPick').click(); }}),
        store.signOut ? h('button',{class:'btn ghost',type:'button',text:'Abmelden',onclick:function(){
          store.signOut(); data = blank(); closeModal(); ui.gate = true; renderList(); updBrand(); renderSheet(); setStatus(''); }}) : null]),
      conf ? h('div',{class:'confirm'},[h('span',{text:'Alle Wochen, Bilder und Einstellungen löschen?'}),
          h('button',{class:'btn danger solid small',type:'button',text:'Ja, alles löschen',onclick:function(){ data=blank(); ui.confirmWipe=false; persist(); closeModal(); openWeek(mondayOf(todayISO())); renderList(); updBrand(); toast('Alle Daten gelöscht'); }}),
          h('button',{class:'btn small',type:'button',text:'Abbrechen',onclick:function(){ ui.confirmWipe=false; openSettings(); }})])
        : h('div',{class:'row'},[h('button',{class:'btn danger small',type:'button',text:'Alle Daten löschen …',onclick:function(){ ui.confirmWipe=true; openSettings(); }})])
    ])
  ]);
  if (focusKey){ var g = document.getElementById('g-'+focusKey); if (g) g.scrollIntoView({block:'center'}); }
}

/* ---------- Dateien ---------- */
function saveFile(name, blob){
  var viaClaude = window.claude && typeof window.claude.use === 'function' ? window.claude.use('downloads') : Promise.resolve(null);
  return viaClaude.then(function(dl){
    if (dl) return dl.save({ filename:name, data:blob }).then(function(){ return true; }, function(e){
      if (e && e.code === 'declined') return false; throw e; });
    var url = URL.createObjectURL(blob), a = h('a',{href:url,download:name});
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    return true;
  });
}
function b64bytes(dataUrl){ var s = atob(dataUrl.split(',')[1]), a = new Uint8Array(s.length); for (var i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
function forDocx(img){ return img ? { bytes:b64bytes(img.dataUrl), ext:img.ext, w:img.w, h:img.h, id:img.id, name:img.name } : null; }
function exportWord(){
  if (!data.weeks.length){ toast('Noch keine Wochen eingetragen.'); return; }
  if (typeof JSZip === 'undefined'){ toast('Die Word-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen.'); return; }
  var btn = $('btnWord'); btn.disabled = true; btn.textContent = 'Wird erstellt …';
  var st = data.settings;
  var payload = { settings:{ name:st.name, logo:forDocx(st.logo), mySig:forDocx(st.mySig), ausbilderSigs:(st.ausbilderSigs||[]).map(forDocx) }, weeks:data.weeks };
  D.buildDocx(payload, window.BH_TEMPLATE, JSZip).then(function(u8){
    var blob = new Blob([u8], {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    var nm = 'Ausbildungsnachweis' + (st.name ? '_' + st.name.trim().replace(/\s+/g,'_') : '') + '.docx';
    return saveFile(nm, blob);
  }).then(function(ok){ if (ok) toast('Word-Dokument erstellt ('+data.weeks.length+' Wochen)'); })
    .catch(function(e){ toast('Word-Dokument konnte nicht erstellt werden: '+(e && e.message ? e.message : e)); })
    .then(function(){ btn.disabled=false; btn.textContent='Word herunterladen'; });
}
function exportJson(){
  var blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  saveFile('Berichtsheft_Sicherung_'+todayISO()+'.json', blob).then(function(ok){ if (ok) toast('Sicherung erstellt'); })
    .catch(function(e){ toast('Sicherung fehlgeschlagen: '+(e && e.message ? e.message : e)); });
}
$('jsonPick').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0]; e.target.value=''; if (!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    try {
      var d = JSON.parse(fr.result);
      if (!d || !Array.isArray(d.weeks) || !d.settings) throw new Error('Unbekanntes Format');
      var b = blank(); d.settings = Object.assign(b.settings, d.settings);
      d.weeks.forEach(function(w){ w.sign = Object.assign({me:false,ausbilderId:null,date:null}, w.sign||{}); ['b','u','s'].forEach(function(k){ w[k] = Object.assign({text:'',hours:''}, w[k]||{}); }); });
      data = d; persist(); closeModal(); var ws = sorted(); openWeek(ws.length ? ws[ws.length-1].monday : mondayOf(todayISO())); renderList(); updBrand();
      toast(ws.length+' Wochen importiert');
    } catch(err){ toast('Import fehlgeschlagen: Die Datei ist keine Berichtsheft-Sicherung.'); }
  };
  fr.readAsText(f);
});

function loadExamples(){
  var m = mondayOf(todayISO()), m1 = D.addDays(m,-14), m2 = D.addDays(m,-7);
  if (!data.settings.abteilungen.length) data.settings.abteilungen = ['Einkauf','Buchhaltung'];
  data.settings.lastAbteilung = data.settings.lastAbteilung || 'Einkauf';
  data.weeks.push({ id:m1, monday:m1, jahr:'1', abteilung:'Einkauf', beispiel:true,
    b:{text:'Erstellung von Bestellungen\nKontrolle von Eingangsrechnungen\nPflege von Lieferantenstammdaten\n- Abgleich der Bankverbindungen', hours:'24'},
    u:{text:'Schulung zur Warenwirtschaft', hours:'2'},
    s:{text:'LF4: Beschaffungsprozesse planen\nEnglisch: Telephoning', hours:'12'}, absence:null, sign:{me:false,ausbilderId:null,date:null} });
  data.weeks.push({ id:m2, monday:m2, jahr:'1', abteilung:'Einkauf', beispiel:true,
    b:{text:'Angebotsvergleich für Verpackungsmaterial\nBestellüberwachung und Mahnung bei Lieferverzug', hours:'16'},
    u:{text:'', hours:''}, s:{text:'LF3: Kaufverträge abschließen', hours:'12'},
    absence:{type:'Feiertage',text:'',hours:'8'}, sign:{me:false,ausbilderId:null,date:null} });
  persist(); openWeek(m2); renderList();
}

function updBrand(){
  var n = data.settings.name; $('brandSub').textContent = n ? n + ' · Ausbildungsnachweis' : 'Ausbildungsnachweis (wöchentlich)';
}

/* ---------- Start ---------- */
$('btnNewWeek').addEventListener('click', function(){ openWeek(nextMonday()); ui.startedEmpty = true; renderSheet(); renderList(); });
$('btnSettings').addEventListener('click', function(){ openSettings(); });
$('btnWord').addEventListener('click', exportWord);
$('btnToggleList').addEventListener('click', function(){ ui.listOpen = !ui.listOpen; renderList(); });

if (store.needsAuth){
  ui.gate = true; renderList(); renderSheet();
  // Beim Zurückkehren zum Tab prüfen, ob ein anderes Gerät etwas geändert hat
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState !== 'visible' || ui.gate || !store.signedIn() || saving || dirty || ui.conflict) return;
    store.remoteChanged().then(function(ch){ if (ch && !dirty && !saving) return reloadFromStore('Neuer Stand aus Google Drive geladen'); })
      .catch(function(e){ if (e && e.code === 'auth'){ /* beim nächsten Speichern melden */ } });
  });
} else {
  openWeek(mondayOf(todayISO())); renderList(); updBrand();
  store.load().then(function(d){
    if (d && d.weeks){ var b = blank(); d.settings = Object.assign(b.settings, d.settings||{}); data = d; }
    var ws = sorted();
    openWeek(ws.length ? ws[ws.length-1].monday : mondayOf(todayISO()));
    renderList(); updBrand(); setStatus(ws.length ? 'Gespeichert' : '');
  }).catch(function(){ setStatus(''); });
}
})();
</script>
